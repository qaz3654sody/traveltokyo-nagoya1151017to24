<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>每日精華 · 115 東京名古屋</title>
<link rel="stylesheet" href="style.css?v=202610301043">
<style>
.stagewrap{margin:10px 0}
#stage{position:relative;width:100%;aspect-ratio:16/9;max-height:74vh;border-radius:18px;overflow:hidden;background:#111;border:1px solid var(--line);user-select:none;-webkit-user-select:none;perspective:1200px}
@media(max-width:700px){#stage{aspect-ratio:4/5}}
#stage:fullscreen{max-height:none;border-radius:0;aspect-ratio:auto;width:100vw;height:100vh}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .7s;overflow:hidden}
.slide.in{opacity:1}
.slide .bg{position:absolute;inset:-6%;background-size:cover;background-position:center;filter:blur(26px) brightness(.6);transform:scale(1.1)}
.slide .fg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.slide video.fg{background:#000}
.slide.in .kb{animation:kb 5s ease-out forwards}
@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.08) translate(var(--kx,0),var(--ky,0))}}
/* 換場：進場動畫輪流使用 */
.slide.in.t-zoom{animation:tZoom .9s cubic-bezier(.2,.8,.2,1)}
@keyframes tZoom{from{transform:scale(1.6) rotate(2deg)}to{transform:none}}
.slide.in.t-wipe{animation:tWipe .8s ease-out}
@keyframes tWipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.slide.in.t-circle{animation:tCircle .9s ease-out}
@keyframes tCircle{from{clip-path:circle(0% at 50% 50%)}to{clip-path:circle(80% at 50% 50%)}}
.slide.in.t-slide{animation:tSlide .75s cubic-bezier(.2,.8,.2,1)}
@keyframes tSlide{from{transform:translateX(100%)}to{transform:none}}
.slide.in.t-flip{animation:tFlip .9s ease-out}
@keyframes tFlip{from{transform:rotateY(90deg);transform-origin:left center}to{transform:none}}
.slide.in.t-up{animation:tUp .75s cubic-bezier(.2,.8,.2,1)}
@keyframes tUp{from{transform:translateY(100%)}to{transform:none}}
/* 標題／結尾 */
.slide.title,.slide.end{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:24px}
.slide.title h2,.slide.end h2{font-size:clamp(38px,9vw,80px);margin:0;letter-spacing:3px;text-shadow:0 2px 14px rgba(0,0,0,.35)}
.slide.in.title h2,.slide.in.end h2{animation:pop .9s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.slide .sub2{font-size:clamp(15px,3.2vw,26px);margin-top:8px;opacity:.95}
.slide .sub3{font-size:clamp(12px,2.4vw,17px);margin-top:14px;opacity:.85;max-width:90%}
.slide.in.title .sub2,.slide.in.end .sub2{animation:rise .8s .4s both}
.slide.in.title .sub3,.slide.in.end .sub3{animation:rise .8s .7s both}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:.95}}
.slide .confetti{position:absolute;inset:0;pointer-events:none}
.slide .confetti i{position:absolute;top:-10%;width:10px;height:16px;border-radius:2px;opacity:.9;animation:fall 3.6s linear infinite}
@keyframes fall{to{transform:translateY(130vh) rotate(540deg)}}
/* 章節轉場卡：交通工具沿著虛線前進 */
.slide.chapter{color:#fff;background:linear-gradient(160deg,var(--c),#1f1b18)}
.slide.chapter .route{position:absolute;left:0;right:0;top:40%;height:0;border-top:4px dotted rgba(255,255,255,.55)}
.slide.chapter .vehicle{position:absolute;top:-34px;left:-90px;font-size:clamp(46px,9vw,72px);filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
.slide.in.chapter .vehicle{animation:drive 1.6s ease-in-out forwards}
.slide.in.chapter .vehicle.m-air{animation:fly 1.7s ease-in forwards}
.slide.in.chapter .vehicle.m-walk{animation:drive 1.8s linear forwards,bob .35s ease-in-out infinite alternate}
@keyframes drive{from{left:-90px}to{left:calc(100% + 20px)}}
@keyframes fly{from{left:-90px;transform:translateY(40px) rotate(-15deg)}to{left:calc(100% + 20px);transform:translateY(-60px) rotate(-15deg)}}
@keyframes bob{from{margin-top:0}to{margin-top:-10px}}
.slide.chapter .mvtxt{position:absolute;left:0;right:0;top:calc(40% + 40px);text-align:center;font-size:clamp(13px,2.8vw,19px);opacity:0}
.slide.in.chapter .mvtxt{animation:rise .6s .35s both}
.slide.chapter .dest{position:absolute;left:0;right:0;bottom:16%;text-align:center;padding:0 16px}
.slide.chapter .dest small{display:inline-block;background:rgba(255,255,255,.22);padding:2px 12px;border-radius:12px;font-weight:700;font-size:clamp(12px,2.6vw,16px)}
.slide.chapter .dest b{display:block;font-size:clamp(22px,5.6vw,44px);margin-top:8px;text-shadow:0 2px 10px rgba(0,0,0,.3)}
.slide.in.chapter .dest{animation:rise .7s .6s both}
/* 字幕 */
.cap{position:absolute;left:0;right:0;bottom:0;padding:34px 16px 14px;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;transform:translateY(12px);opacity:0;transition:.6s .3s}
.slide.in .cap{transform:none;opacity:1}
.cap .ct{display:inline-block;background:var(--c,#d9534f);padding:1px 9px;border-radius:10px;font-size:12px;font-weight:700;margin-right:8px}
.cap b{font-size:clamp(15px,3.4vw,22px)}
#segs{position:absolute;top:8px;left:10px;right:10px;display:flex;gap:2px;z-index:5}
#segs i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.35);overflow:hidden}
#segs b{display:block;height:100%;width:0;background:#fff}
.tap{position:absolute;top:0;bottom:60px;width:30%;z-index:4;cursor:pointer}
.tap.l{left:0}.tap.r{right:0}
#bigplay{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);color:#fff;font-size:70px;cursor:pointer}
#bigplay span{width:100px;height:100px;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding-left:8px}
.ctrls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.ctrls .btn{min-width:44px}
.ctrls input[type=range]{width:90px}
.chapters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.chapters .chip{font-size:12.5px}
.daygrid2{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:10px 0}
.dt2{border:2px solid var(--line);border-radius:12px;padding:6px 2px;text-align:center;cursor:pointer;background:var(--card);line-height:1.25}
.dt2 i{display:flex;align-items:center;justify-content:center;width:24px;height:24px;margin:0 auto 2px;border-radius:50%;background:var(--c);color:#fff;font-style:normal;font-weight:700;font-size:13px}
.dt2 b{display:block;font-size:12px}.dt2 small{display:block;font-size:10px;color:var(--mute)}
.dt2.on{border-color:var(--c);background:var(--chip)}
.dt2.off{opacity:.45;cursor:default}
@media(max-width:600px){.daygrid2{grid-template-columns:repeat(4,1fr)}}
.note2{font-size:13px;color:var(--mute);margin:6px 0}
</style>
</head>
<body>
<header class="top">
  <h1>🎬 每日精華</h1>
  <div class="sub">每天一支小短片：精選照片、影片、換場動畫和背景音樂</div>
</header>
<div class="bar"><div>
  <nav></nav>
  <label class="sw"><input type="checkbox" id="tPp"><i></i>主角 🔒</label>
</div></div>
<main>
  <div class="daygrid2" id="days"></div>
  <div class="stagewrap">
    <div id="stage">
      <div id="segs"></div>
      <div class="tap l" id="tapl"></div><div class="tap r" id="tapr"></div>
      <div id="bigplay"><span>▶</span></div>
    </div>
    <div class="ctrls">
      <button class="btn" id="bPrev" title="上一段">⏮</button>
      <button class="btn pri" id="bPlay" title="播放／暫停">▶ 播放</button>
      <button class="btn" id="bNext" title="下一段">⏭</button>
      <button class="btn" id="bSpeed" title="播放速度">1×</button>
      <button class="btn" id="bMusic" title="背景音樂開關">🔊 音樂</button>
      <input type="range" id="vol" min="0" max="100" value="40" title="音量">
      <button class="btn" id="bFull" title="全螢幕">⛶</button>
      <span class="sub" id="count"></span>
    </div>
    <div class="note2" id="note"></div>
    <div class="chapters" id="chapters"></div>
  </div>
</main>
<script src="data.js?v=202610301043"></script>
<script src="expenses.js?v=202610301043"></script>
<script src="moves.js?v=202610301043"></script>
<script src="reels.js?v=202610301043"></script>
<script src="app.js?v=202610301043"></script>
<script>
const READY=Object.keys(window.REEL_PLAN||{}).map(Number);
let day=+(location.hash.replace('#','')||0)||READY[0]||1;
let slides=[],cur=0,playing=false,speed=1,tm=0,tStart=0,elapsed=0,tDur=3000,token=0;
const TR=['t-zoom','t-wipe','t-circle','t-slide','t-flip','t-up'];
const srcOf=async it=>it.locked?await decFile(it.id):srcFull(it);
const modeOf=m=>{const e=((m||'').match(/^[^\s]+/)||[''])[0];return {'🚶':['🚶','walk'],'🚇':['🚇','train'],'🚌':['🚌','bus'],'🚕':['🚕','car'],'✈️':['✈️','air'],'🚄':['🚄','train']}[e]||['📍','car']};

/* ---------- 背景音樂：內建合成曲（不需音檔、沒有版權問題）；也可放自己的 reel/bgm.mp3 ---------- */
const Music={ctx:null,master:null,audio:null,useFile:false,timer:null,step:0,next:0,on:true,vol:.4,checked:false,
  async init(){
    if(this.checked)return;this.checked=true;
    try{const r=await fetch('reel/bgm.mp3',{method:'HEAD'});if(r.ok){this.audio=new Audio('reel/bgm.mp3');this.audio.loop=true;this.useFile=true}}catch(_){}
  },
  setVol(v){this.vol=v;if(this.useFile&&this.audio)this.audio.volume=this.on?v:0;if(this.master)this.master.gain.value=this.on?v:0},
  setOn(o){this.on=o;this.setVol(this.vol)},
  async start(){
    await this.init();
    if(this.useFile){this.audio.volume=this.on?this.vol:0;this.audio.play().catch(()=>{});return}
    if(!this.ctx){
      const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
      this.ctx=new C();this.master=this.ctx.createGain();this.master.gain.value=this.on?this.vol:0;
      const lp=this.ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;this.master.connect(lp);lp.connect(this.ctx.destination);
    }
    await this.ctx.resume();this.next=this.ctx.currentTime+.08;this.sched();
  },
  stop(){clearTimeout(this.timer);if(this.useFile&&this.audio)this.audio.pause();else if(this.ctx)this.ctx.suspend()},
  tone(f,t,d,type,vol,atk=.01){
    const c=this.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+atk);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(this.master);o.start(t);o.stop(t+d+.05);
  },
  noise(t,d,vol,hp){
    const c=this.ctx,n=c.sampleRate*d,b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);
    for(let i=0;i<n;i++)a[i]=Math.random()*2-1;
    const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=hp;
    const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(f);f.connect(g);g.connect(this.master);s.start(t);
  },
  sched(){
    const c=this.ctx;if(!c)return;
    const sp=60/104/2; // 八分音符
    const N={C2:65.41,F2:87.31,G2:98,A2:110,C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392,A4:440,B4:493.88,C5:523.25,D5:587.33,E5:659.25};
    const prog=[
      {root:130.81,tri:[N.C4,N.E4,N.G4],mel:[N.E5,N.D5,N.C5,N.G4]},
      {root:98,tri:[N.D4,N.G4,N.B4],mel:[N.D5,N.B4,N.G4,N.D5]},
      {root:110,tri:[N.C4,N.E4,N.A4],mel:[N.C5,N.E5,N.D5,N.C5]},
      {root:87.31,tri:[N.C4,N.F4,N.A4],mel:[N.A4,N.C5,N.D5,N.E5]}
    ];
    while(this.next<c.currentTime+.6){
      const t=this.next,s=this.step%32,ch=prog[Math.floor(s/8)],k=s%8;
      if(k===0){ch.tri.forEach(f=>this.tone(f/2,t,spToDur(sp*8),'triangle',.07,.5))}
      if(k%4===0){this.tone(ch.root,t,sp*3.5,'sine',.22,.01);this.tone(60,t,.16,'sine',.3,.005)}
      this.tone(ch.tri[[0,1,2,1,0,1,2,1][k]]*2,t,sp*1.6,'triangle',.09,.005);
      if(k%2===1)this.noise(t,.05,.05,7000);
      if(k===4||k===6)this.tone(ch.mel[(Math.floor(s/2)%4)],t,sp*2.4,'sine',.1,.02);
      this.next+=sp;this.step++;
    }
    this.timer=setTimeout(()=>this.sched(),180);
  }
};
function spToDur(x){return x}

/* ---------- 組成短片：每個景點 = 轉場卡 + 代表照（+ 影片 + 主角照）---------- */
function buildSlides(){
  const D=T.days[day-1],people=$('#tPp').checked&&!!cryptoKey,plan=(window.REEL_PLAN||{})[day]||[];
  const out=[{type:'title'}];let ti=0;
  plan.forEach((p,k)=>{
    const s=D.spots.find(x=>x.id===p.spot);if(!s)return;
    const find=id=>s.items.find(i=>i.id===id);
    const plain=s.items.filter(i=>!i.locked);
    const hero=find(p.photo)&&!find(p.photo).locked?find(p.photo):plain[0];
    const [em,mode]=modeOf(s.move);
    out.push({type:'chapter',spot:s,k,em,mode});
    if(hero)out.push({type:'photo',it:hero,spot:s,k,tr:TR[ti++%TR.length]});
    (p.videos||[]).forEach(name=>{const v=(window.REEL_CLIPS||{})[name];if(v)out.push({type:'video',v,spot:s,k,tr:TR[ti++%TR.length]})});
    const pp=p.people&&find(p.people);
    if(people&&pp)out.push({type:'photo',it:pp,spot:s,k,tr:TR[ti++%TR.length]});
  });
  out.push({type:'end'});
  slides=out;
}
function chapters(){
  const first={};
  slides.forEach((s,i)=>{if(s.type==='chapter'&&first[s.k]===undefined)first[s.k]=i});
  $('#chapters').innerHTML=Object.values(first).map(i=>{const s=slides[i].spot;return `<span class="chip" data-i="${i}">${esc(s.time)} ${esc(s.name.replace(/（.*$/,''))}</span>`}).join('');
  $$('#chapters .chip').forEach(c=>c.onclick=()=>go(+c.dataset.i));
}
function segs(){$('#segs').innerHTML=slides.map(()=>'<i><b></b></i>').join('')}
function setProg(p){$$('#segs b').forEach((b,i)=>b.style.width=(i<cur?'100%':i>cur?'0':Math.min(100,Math.max(0,p*100))+'%'))}
function confetti(col){
  const cs=['#f2c94c','#fff','#ff8a80','#80d8ff','#b9f6ca',col];
  return `<div class="confetti">${Array.from({length:26},(_,i)=>`<i style="left:${(i*37)%100}%;background:${cs[i%cs.length]};animation-delay:${(i%9)*.35}s;animation-duration:${3+(i%5)*.5}s"></i>`).join('')}</div>`;
}
async function show(i){
  const my=++token;cur=Math.max(0,Math.min(slides.length-1,i));
  const s=slides[cur],D=T.days[day-1],col=COLORS[day-1],st=$('#stage');
  const el=document.createElement('div');el.className='slide '+s.type+(s.tr?' '+s.tr:'');el.style.setProperty('--c',col);
  let video=null;
  if(s.type==='title'){
    el.style.background=`linear-gradient(135deg,${col},#2b2622)`;
    el.innerHTML=`${confetti(col)}<h2>Day ${day}</h2><div class="sub2">${esc(D.date)}　${esc(titleOf('d'+day,D.title))}</div><div class="sub3">${esc(titleOf('i'+day+'o',((window.DAYINFO||{})[day]||{}).o||''))}</div>`;
    tDur=3200;
  }else if(s.type==='end'){
    el.style.background=`linear-gradient(135deg,#2b2622,${col})`;
    el.innerHTML=`${confetti(col)}<h2>Day ${day} 完</h2><div class="sub2">${esc(titleOf('i'+day+'b',((window.DAYINFO||{})[day]||{}).b||''))}</div><div class="sub3">謝謝收看 ❤️</div>`;
    tDur=4200;
  }else if(s.type==='chapter'){
    const sp=s.spot;
    el.innerHTML=`<div class="route"><span class="vehicle m-${s.mode==='air'?'air':s.mode==='walk'?'walk':'x'}">${s.em}</span></div><div class="mvtxt">${esc(sp.move||'')}</div><div class="dest"><small>${esc(sp.time)}</small><b>${esc(sp.name.replace(/（.*$/,''))}</b></div>`;
    tDur=2100;
  }else{
    const sp=s.spot;
    const cap=`<div class="cap"><span class="ct">${esc(sp.time)}</span><b>${esc(sp.name.replace(/（.*$/,''))}</b></div>`;
    if(s.type==='photo'){
      let url;try{url=await srcOf(s.it)}catch(e){url=''}
      if(my!==token)return;
      const kx=(Math.random()*2-1)*2.5+'%',ky=(Math.random()*2-1)*2+'%';
      el.innerHTML=`<div class="bg" style="background-image:url('${url}')"></div><img class="fg kb" src="${url}" style="--kx:${kx};--ky:${ky}">${cap}`;
      tDur=2800;
    }else{
      el.innerHTML=`<div class="bg" style="background-image:url('${s.v.poster}')"></div><video class="fg" src="${s.v.src}" poster="${s.v.poster}" muted playsinline preload="auto"></video>${cap}`;
      video=el.querySelector('video');video.playbackRate=speed;tDur=6000;
    }
  }
  st.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('in'));
  $$('#stage .slide').forEach(o=>{if(o!==el){const v=o.querySelector('video');if(v)v.pause();o.classList.remove('in');setTimeout(()=>o.remove(),900)}});
  $('#count').textContent=`${cur+1} / ${slides.length}`;
  elapsed=0;tStart=performance.now();setProg(0);
  if(video){
    video.onloadedmetadata=()=>{if(isFinite(video.duration))tDur=Math.min(8000,video.duration*1000)};
    video.onended=()=>{if(playing&&my===token)next()};
    if(playing)video.play().catch(()=>{});
    el._video=video;
  }
  const nx=slides[cur+1];if(nx&&nx.type==='photo'&&!nx.it.locked){const im=new Image();im.src=srcFull(nx.it)}
}
function curVideo(){const els=$$('#stage .slide.in');const e=els[els.length-1];return e&&e._video}
function loop(ts){
  if(!playing)return;
  const v=curVideo();let p;
  if(v&&isFinite(v.duration)&&v.duration>0)p=Math.min(v.currentTime/v.duration,(ts-tStart)/(tDur/speed));
  else p=(ts-tStart)/(tDur/speed);
  setProg(p);
  if(p>=1)next();
}
const startLoop=()=>{clearInterval(tm);tm=setInterval(()=>loop(performance.now()),60)};
const stopLoop=()=>clearInterval(tm);
function play(){
  if(playing)return;playing=true;$('#bigplay').style.display='none';$('#bPlay').textContent='⏸ 暫停';
  tStart=performance.now()-elapsed;const v=curVideo();if(v){v.playbackRate=speed;v.play().catch(()=>{})}
  Music.start();startLoop();
}
function pause(){
  if(!playing)return;playing=false;stopLoop();elapsed=performance.now()-tStart;$('#bPlay').textContent='▶ 播放';
  const v=curVideo();if(v)v.pause();Music.stop();
}
function go(i){const was=playing;stopLoop();elapsed=0;show(i).then(()=>{if(was)startLoop()})}
function next(){
  if(cur>=slides.length-1){pause();$('#bigplay').style.display='flex';$('#bigplay span').textContent='↻';cur=-1;return}
  go(cur+1);
}
function prev(){go(Math.max(0,cur-1))}

function renderDays(){
  $('#days').innerHTML=T.days.map(d=>`<div class="dt2 ${d.day===day?'on':''} ${READY.includes(d.day)?'':'off'}" data-d="${d.day}" style="--c:${COLORS[d.day-1]}"><i>${d.day}</i><b>${d.date.split(' ')[0]}</b><small>${READY.includes(d.day)?d.date.split(' ')[1]:'製作中'}</small></div>`).join('');
  $$('#days .dt2').forEach(t=>t.onclick=()=>{const d=+t.dataset.d;if(!READY.includes(d))return;day=d;location.hash=d;load()});
}
function load(){
  pause();elapsed=0;token++;
  $$('#stage .slide').forEach(o=>o.remove());
  renderDays();buildSlides();segs();chapters();
  $('#note').textContent=($('#tPp').checked&&cryptoKey?'已加入主角照片。':'目前不含主角照片：上方開啟「主角」並輸入密碼後，會多放你們的合照。')+'　背景音樂是內建合成曲，想換自己的歌請看說明。';
  $('#bigplay').style.display='flex';$('#bigplay span').textContent='▶';
  cur=0;show(0);
}
$('#bigplay').onclick=()=>{if(cur<0){cur=0;go(0)}play()};
$('#bPlay').onclick=()=>playing?pause():(cur<0?(go(0),play()):play());
$('#bNext').onclick=()=>{if(cur<slides.length-1)go(cur+1)};
$('#bPrev').onclick=prev;
$('#tapl').onclick=prev;$('#tapr').onclick=()=>{if(cur<slides.length-1)go(cur+1)};
$('#bSpeed').onclick=()=>{speed=speed===1?1.5:speed===1.5?2:speed===2?.5:1;$('#bSpeed').textContent=speed+'×';const v=curVideo();if(v)v.playbackRate=speed};
$('#bMusic').onclick=()=>{Music.setOn(!Music.on);$('#bMusic').textContent=Music.on?'🔊 音樂':'🔇 音樂'};
$('#vol').oninput=e=>Music.setVol(e.target.value/100);
$('#bFull').onclick=()=>{const st=$('#stage');document.fullscreenElement?document.exitFullscreen():(st.requestFullscreen&&st.requestFullscreen())};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')$('#bNext').click();else if(e.key==='ArrowLeft')prev();else if(e.key===' '){e.preventDefault();$('#bPlay').click()}});
const tPp=$('#tPp');
tPp.onchange=async()=>{
  if(tPp.checked){if(!await ensureUnlocked()){tPp.checked=false;return}store.set('showpp','1')}else store.set('showpp','0');
  load();
};
loadNotes().then(async()=>{
  initSide();
  if(store.get('showpp','0')==='1'){const ok=await ensureUnlocked();tPp.checked=ok}
  load();
});
</script>
</body>
</html>
