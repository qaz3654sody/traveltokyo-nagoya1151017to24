<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>花費分析 · 115 東京名古屋</title>
<link rel="stylesheet" href="style.css?v=202610281458">
<style>
.chipgrp{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.fl{font-size:12px;color:var(--mute);margin-top:6px}
.chip.sm{padding:3px 10px;font-size:13px}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.donutwrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.donutwrap svg{flex:none}
.legend{flex:1;min-width:170px;font-size:13px}
.legend div{display:flex;align-items:center;gap:6px;padding:2px 0}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend span.v{margin-left:auto;white-space:nowrap}
.legend span.p{color:var(--mute);width:42px;text-align:right}
.top10 div{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
.top10 b{width:22px;color:var(--mute)}
.top10 span.g{flex:1}
.top10 small{color:var(--mute)}
svg text{font-family:inherit}

.daygrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:4px 0 10px}
.dtile{border:2px solid var(--line);border-radius:12px;padding:6px 2px;text-align:center;cursor:pointer;background:var(--bg);user-select:none;line-height:1.25}
.dtile i{display:flex;align-items:center;justify-content:center;width:24px;height:24px;margin:0 auto 2px;border-radius:50%;background:var(--c);color:#fff;font-style:normal;font-weight:700;font-size:13px}
.dtile b{display:block;font-size:12px}
.dtile small{display:block;font-size:10px;color:var(--mute)}
.dtile.on{border-color:var(--c);background:var(--chip);box-shadow:0 0 0 1px var(--c) inset}
@media(max-width:600px){.daygrid{grid-template-columns:repeat(4,1fr)}}
.flag{color:var(--acc);font-size:12px}
.full{display:none;margin-top:6px;padding:8px;background:var(--bg);border-radius:8px;font-size:12px;color:var(--ink);white-space:pre-wrap;word-break:break-word}
tr.open .full{display:block}
.shop{font-weight:600}
td .sm{font-size:12px;color:var(--mute)}

.chip.sm[style*="--cc"]{background:color-mix(in srgb,var(--cc) 16%,var(--bg));border-color:color-mix(in srgb,var(--cc) 55%,transparent)}
.chip.sm[style*="--cc"].on{background:var(--cc);border-color:var(--cc);color:#fff;text-shadow:0 0 2px rgba(0,0,0,.35)}
.cdot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:middle}
</style>
</head>
<body>
<header class="top">
  <h1>💰 花費分析</h1>
  <div class="sub">資料來源：MOZE 記帳 · 日圓依匯率換算成台幣統計</div>
</header>
<div class="bar"><div>
  <nav><a href="index.html"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>行程總覽</a><a href="expenses.html" class="on"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 8l3 4 3-4M8.5 12.5h7M8.5 15.5h7M12 12v6"/></svg>花費分析</a></nav>
  <label class="sw" style="gap:6px">匯率 <input id="rate" class="rin" type="number" step="0.001" min="0.05" max="1" style="width:80px;padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)"></label>
</div></div>
<main id="app">
  <div class="stats" id="stats"></div>
  <div class="panel" id="x-filter">
    <div class="fl">天數（可複選，不選＝全部）</div><div class="daygrid" id="gDay"></div>
    <div class="fl">主類別</div><div class="chipgrp" id="gCat"></div>
    <div class="fl">子類別（會依選的主類別縮小範圍）</div><div class="chipgrp" id="gSub"></div>
    <div class="fl">幣別</div><div class="chipgrp" id="gCur"></div>
    <div class="filters" style="margin-top:6px">
      <div><label>關鍵字（名稱／商家／明細）</label><input id="fQ" placeholder="例如：唐吉訶德"></div>
      <div><label>台幣金額 ≥</label><input id="fMin" type="number" min="0" placeholder="0"></div>
    </div>
    <div style="margin-top:8px"><button class="btn" id="reset">清除篩選</button> <span class="sub" id="cnt"></span></div>
  </div>
  <div class="twocol" id="x-pie">
    <div class="panel"><b>主類別占比</b><div class="donutwrap" id="dCat"></div></div>
    <div class="panel"><b>子類別占比（前 8）</b><div class="donutwrap" id="dSub"></div></div>
  </div>
  <div class="panel" id="x-line"><b>累計花費走勢（台幣）</b><div id="lineWrap"></div></div>
  <div class="twocol" id="x-day">
    <div class="panel"><b>依天數</b><div class="bars alt" id="bDay"></div></div>
    <div class="panel"><b>依時段</b><div class="bars" id="bHour"></div></div>
  </div>
  <div class="twocol" id="x-shop">
    <div class="panel"><b>日圓／台幣占比</b><div class="donutwrap" id="dCur"></div></div>
    <div class="panel"><b>依商家（前 10）</b><div class="bars alt" id="bShop"></div></div>
  </div>
  <div class="panel" id="x-top"><b>最大額的 10 筆</b><div class="top10" id="top10"></div></div>
  <div class="panel" id="x-table"><b>明細</b> <span class="sub">（點欄位標題排序、點一列展開完整明細）</span>
    <div class="tw"><table><thead><tr><th data-k="date">日期</th><th data-k="cat">類別</th><th data-k="place">店家／購買內容</th><th data-k="cur" class="hm">原幣</th><th data-k="twd" class="n">台幣</th></tr></thead><tbody id="tb"></tbody></table></div>
  </div>
</main>
<script src="data.js?v=202610281458"></script>
<script src="expenses.js?v=202610281458"></script>
<script src="app.js?v=202610281458"></script>
<script>
const E=window.EXPENSES;
const CAT_COL={交通:'#3d6fb5',飲食:'#e8883a',生活:'#7a57b5',個人:'#b5578f',家居:'#4c9a5a',購物:'#d9534f',娛樂:'#c9a227',醫療:'#2f7d8c'};
function hslOf(hex){const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let h=0,s=0;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}return [Math.round(h),Math.round(s*100),Math.round(l*100)]}
const SUBS_BY_CAT={};E.forEach(x=>{(SUBS_BY_CAT[x.cat]=SUBS_BY_CAT[x.cat]||[]);if(!SUBS_BY_CAT[x.cat].includes(x.sub))SUBS_BY_CAT[x.cat].push(x.sub)});
const SUB_CAT={};E.forEach(x=>SUB_CAT[x.sub]=x.cat);
const catColor=c=>CAT_COL[c]||'#8a7f76';
function subColor(sub){const cat=SUB_CAT[sub],list=SUBS_BY_CAT[cat]||[sub],i=list.indexOf(sub),n=list.length;const [h,s]=hslOf(catColor(cat));const L=n>1?34+(i/(n-1))*34:50;return `hsl(${h},${s}%,${L}%)`}
const keyColor=k=>CAT_COL[k]?CAT_COL[k]:(SUB_CAT[k]?subColor(k):null);
const PAL=['#d9534f','#e8883a','#c9a227','#4c9a5a','#2f7d8c','#3d6fb5','#7a57b5','#b5578f','#8a7f76','#5fa8a0'];
const sel={day:new Set(),cat:new Set(),sub:new Set(),cur:new Set()};
const uniq=a=>[...new Set(a)];
const CATS=uniq(E.map(e=>e.cat));
const SUBOF=cat=>uniq(E.filter(e=>!cat.size||cat.has(e.cat)).map(e=>e.sub));
let sortK='date',sortDir=1;
const label=e=>e.place||e.name||e.shop||e.sub;

function chips(id,items,set,render,colorFn){
  $(id).innerHTML=items.map(([v,t])=>{const c=colorFn?colorFn(v):null;return `<span class="chip sm ${set.has(String(v))?'on':''}" data-v="${esc(v)}"${c?` style="--cc:${c}"`:''}>${esc(t)}</span>`}).join('');
  $$(id+' .chip').forEach(c=>c.onclick=()=>{const v=c.dataset.v;set.has(v)?set.delete(v):set.add(v);render()});
}
function drawFilters(){
  // 子類別依主類別縮小；已選但不在範圍內的自動取消
  const subs=SUBOF(sel.cat);[...sel.sub].forEach(s=>{if(!subs.includes(s))sel.sub.delete(s)});
  $('#gDay').innerHTML=T.days.map(d=>{const [md,wd]=d.date.split(' ');return `<div class="dtile ${sel.day.has(String(d.day))?'on':''}" data-v="${d.day}" style="--c:${COLORS[d.day-1]}"><i>${d.day}</i><b>${md}</b><small>${wd}</small></div>`}).join('');
  $$('#gDay .dtile').forEach(c=>c.onclick=()=>{const v=c.dataset.v;sel.day.has(v)?sel.day.delete(v):sel.day.add(v);update()});
  chips('#gCat',CATS.map(c=>[c,c]),sel.cat,update,catColor);
  chips('#gSub',subs.map(c=>[c,c]),sel.sub,update,subColor);
  chips('#gCur',[['JPY','日圓 JPY'],['TWD','台幣 TWD']],sel.cur,update);
}
function filtered(){
  const q=$('#fQ').value.trim().toLowerCase(),m=+$('#fMin').value||0;
  return E.filter(e=>(!sel.day.size||sel.day.has(String(e.day)))&&(!sel.cat.size||sel.cat.has(e.cat))&&(!sel.sub.size||sel.sub.has(e.sub))&&(!sel.cur.size||sel.cur.has(e.cur))&&twd(e)>=m&&
    (!q||(e.place+e.addr+e.sum+e.name+e.shop+e.desc+e.sub+e.cat).toLowerCase().includes(q)));
}
function group(list,key){const m={};list.forEach(e=>{const k=key(e);m[k]=(m[k]||0)+twd(e)});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function bars(id,rows,limit,colorFn){
  rows=rows.slice(0,limit||99);const max=Math.max(1,...rows.map(r=>r[1]));
  $(id).innerHTML=rows.map(([k,v])=>`<div class="r"><span class="l" title="${esc(k)}">${esc(k)}</span><span><div class="b" style="width:${v/max*100}%${colorFn&&colorFn(k)?';background:'+colorFn(k):''}"></div></span><span class="v">${nt(v)}</span></div>`).join('')||'<span class="sub">沒有資料</span>';
}
function donut(id,rows,top,colorFn){
  const colOf=(k,i)=>(colorFn&&colorFn(k))||PAL[i%PAL.length];
  let r=rows.filter(x=>x[1]>0);
  if(top&&r.length>top){const rest=r.slice(top).reduce((a,x)=>a+x[1],0);r=r.slice(0,top).concat([['其他',rest]])}
  const tot=r.reduce((a,x)=>a+x[1],0);
  if(!tot){$(id).innerHTML='<span class="sub">沒有資料</span>';return}
  const R=58,C=2*Math.PI*R;let off=0;
  const arcs=r.map(([k,v],i)=>{const f=v/tot,dash=f*C;const el=`<circle r="${R}" cx="80" cy="80" fill="none" stroke="${colOf(k,i)}" stroke-width="30" stroke-dasharray="${dash} ${C-dash}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"><title>${esc(k)} ${nt(v)}（${(f*100).toFixed(1)}%）</title></circle>`;off+=dash;return el}).join('');
  $(id).innerHTML=`<svg width="160" height="160" viewBox="0 0 160 160">${arcs}<text x="80" y="76" text-anchor="middle" font-size="11" fill="var(--mute)">合計</text><text x="80" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">${nt(tot)}</text></svg>
  <div class="legend">${r.map(([k,v],i)=>`<div><i style="background:${colOf(k,i)}"></i><span>${esc(k)}</span><span class="v">${nt(v)}</span><span class="p">${(v/tot*100).toFixed(1)}%</span></div>`).join('')}</div>`;
}
function lineChart(L){
  const per=[...Array(8)].map((_,i)=>sumTWD(L.filter(e=>e.day===i+1)));
  let acc=0;const cum=per.map(v=>acc+=v);const max=Math.max(1,...cum);
  const W=560,H=200,p=34,xs=i=>p+i*(W-2*p)/7,ys=v=>H-p-(v/max)*(H-2*p);
  const pts=cum.map((v,i)=>[xs(i),ys(v)]);
  const line=pts.map((q,i)=>(i?'L':'M')+q[0]+','+q[1]).join(' ');
  $('#lineWrap').innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
   ${[0,.5,1].map(f=>`<line x1="${p}" x2="${W-p}" y1="${ys(max*f)}" y2="${ys(max*f)}" stroke="var(--line)"/><text x="${p-4}" y="${ys(max*f)+4}" text-anchor="end" font-size="10" fill="var(--mute)">${Math.round(max*f/1000)}k</text>`).join('')}
   <path d="${line} L${xs(7)},${H-p} L${xs(0)},${H-p} Z" fill="var(--acc)" opacity=".12"/>
   <path d="${line}" fill="none" stroke="var(--acc)" stroke-width="3" stroke-linejoin="round"/>
   ${pts.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="4.5" fill="var(--acc)"><title>Day ${i+1}：當日 ${nt(per[i])}，累計 ${nt(cum[i])}</title></circle><text x="${q[0]}" y="${H-p+16}" text-anchor="middle" font-size="11" fill="var(--mute)">D${i+1}</text><text x="${q[0]}" y="${q[1]-9}" text-anchor="middle" font-size="10" fill="var(--ink)">${Math.round(cum[i]/1000)}k</text>`).join('')}
  </svg>`;
}
function hourBucket(t){const h=+t.slice(0,2);return h<6?'凌晨 0–6':h<11?'早上 6–11':h<14?'中午 11–14':h<18?'下午 14–18':'晚上 18–24'}

function update(){drawFilters();render()}
function render(){
  const L=filtered(),tot=sumTWD(L),jp=L.filter(e=>e.cur==='JPY'),tw=L.filter(e=>e.cur==='TWD');
  const days=new Set(L.map(e=>e.day)).size||1;
  $('#stats').innerHTML=[
    [nt(tot),'台幣合計（含日圓換算）'],
    ['¥'+jp.reduce((a,e)=>a+e.amt,0).toLocaleString(),`日圓花費（${jp.length} 筆）`],
    [nt(tw.reduce((a,e)=>a+e.amt,0)),`台幣花費（${tw.length} 筆）`],
    [nt(tot/days),'平均每天'],
    [nt(L.length?Math.max(...L.map(twd)):0),'單筆最高']
  ].map(([b,s])=>`<div class="stat"><b>${b}</b><span>${s}</span></div>`).join('');
  $('#cnt').textContent=`共 ${L.length} 筆`;
  donut('#dCat',group(L,e=>e.cat),0,keyColor);
  donut('#dSub',group(L,e=>e.sub),8,keyColor);
  donut('#dCur',group(L,e=>e.cur==='JPY'?'日圓花費（換算）':'台幣花費'));
  lineChart(L);
  bars('#bDay',group(L,e=>'Day '+e.day).sort((a,b)=>a[0].localeCompare(b[0],'en',{numeric:true})));
  const order=['凌晨 0–6','早上 6–11','中午 11–14','下午 14–18','晚上 18–24'];
  bars('#bHour',group(L,e=>hourBucket(e.time)).sort((a,b)=>order.indexOf(a[0])-order.indexOf(b[0])));
  bars('#bShop',group(L,e=>e.place||'（未填商家）'),10);
  $('#top10').innerHTML=[...L].sort((a,b)=>twd(b)-twd(a)).slice(0,10).map((e,i)=>`<div><b>${i+1}</b><span class="g">${esc(label(e))}<br><small>Day ${e.day} · ${esc(e.sum.slice(0,36))}</small></span><span>${nt(twd(e))}</span></div>`).join('')||'<span class="sub">沒有資料</span>';
  const rows=[...L].sort((a,b)=>{
    const g=e=>sortK==='twd'?twd(e):sortK==='date'?e.date+e.time:(e[sortK]||'');
    const x=g(a),y=g(b);return (x>y?1:x<y?-1:0)*sortDir});
  $('#tb').innerHTML=rows.map(e=>`<tr class="row"><td>${e.date.slice(5)}<br><small class="sub">${e.time}</small></td><td><div class="shop">${esc(label(e))}</div>${e.addr?`<div class="sm">📍 ${esc(e.addr)}</div>`:''}<div>${esc(e.sum)}</div><div class="sm"><span class="cdot" style="background:${subColor(e.sub)}"></span>${esc(e.cat)}・${esc(e.sub)}</div>${e.flag?`<div class="flag">⚠ ${esc(e.flag)}</div>`:''}<div class="full">${e.desc?esc(e.desc):'（記帳時沒有留下明細）'}</div></td><td class="n hm">${e.cur==='JPY'?'¥':'NT$'}${e.amt.toLocaleString()}</td><td class="n">${nt(twd(e))}${e.cur==='JPY'?`<br><small class="sub">¥${e.amt.toLocaleString()}</small>`:''}</td></tr>`).join('');
  $$('#tb tr').forEach(r=>r.onclick=()=>r.classList.toggle('open'));
}
$('#rate').value=RATE;
['fQ','fMin'].forEach(i=>$('#'+i).oninput=render);
$('#reset').onclick=()=>{Object.values(sel).forEach(s=>s.clear());$('#fQ').value='';$('#fMin').value='';update()};
$('#rate').oninput=()=>{const v=parseFloat($('#rate').value);if(v>0){RATE=v;lstore.set('rate',v);render()}};
$$('th[data-k]').forEach(th=>th.onclick=()=>{const k=th.dataset.k;sortDir=sortK===k?-sortDir:1;sortK=k;render()});
update();
initSide();
window.addEventListener('ratechange',()=>{$('#rate').value=RATE;render()});
</script>
</body>
</html>
