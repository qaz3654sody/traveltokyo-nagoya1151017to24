<script>
const EX=EXPBY();
const DEF_COVER={1:'d1s1_1',2:'d2s1_1',3:'d3s7_4',4:'d4s1_0',5:'d5s3_0',6:'d6s3_0',7:'d7s2_3',8:'d8s5_2'};
const spotsOf=d=>T.days[d-1].spots;
const plain=s=>s.items.filter(i=>!i.locked);
const coverItem=d=>{
  const id=(T.covers&&T.covers[d])||DEF_COVER[d];
  const all=spotsOf(d).flatMap(plain);
  return all.find(i=>i.id===id)||all[0];
};
const dayExp=d=>spotsOf(d).flatMap(s=>s.exp.map(i=>EX[i]));
const geo=s=>s.lat!=null&&s.lon!=null&&s.lat>30;
const shortDate=d=>T.days[d-1].date;

/* ---------- 景點小圖示 ---------- */
const ICONS=[[/HAPUNA|早餐/,'🍳'],[/機場|Airport|HND|TSA|NGO|TPE/,'✈️'],[/新幹線|站 →|名鐵|機場站/,'🚄'],[/飯店|王子|京阪/,'🏨'],
 [/名古屋城/,'🏯'],[/晴空塔|電視塔|鐵塔/,'🗼'],[/富士|新倉山|大石|忍野|河口湖|富士山/,'🗻'],[/白川|飛驒|高山/,'🏘️'],[/吉卜力/,'🌳'],
 [/神宮|增上寺|三解脫門|淺草寺|雷門/,'⛩️'],[/八公/,'🐕'],[/公園|綠洲/,'🌃'],
 [/喫茶|客美多|HARBS|茶和和|星巴克|BUTTER/,'☕'],[/燒肉|敘敘苑|牛|拉麵|獅子丸|豬排|味噌|鰻|蓬萊軒|半藏|神座|金富士|仙貝|洋芋片|Jaga/,'🍜'],
 [/寶可夢|迪士尼|哈利波特/,'🎮'],[/Bic|UNIQLO|唐吉訶德|松本清|3COINS|大創|PLUSTA/,'🛍️'],[/京急|超市|OK|Life|全家|MaxValu|羅森|日川/,'🛒'],[/家/,'🏠']];
const iconOf=n=>{for(const [r,e] of ICONS)if(r.test(n))return e;return '📍'};


/* ---------- 每天的示意背景 ---------- */
function scene(d,W,H){
  const SK={1:['#bfe1ff','#fff3e3'],2:['#b6dcff','#eaf6ff'],3:['#6f66b0','#f4a3a0','#ffe2aa'],4:['#c9e6ff','#fff0f2'],5:['#cfe9ff','#f1f8ff'],6:['#c4dcf2','#f6faff'],7:['#cdeec2','#f2fbea'],8:['#bfe0ff','#fff4de']}[d];
  const cloud=(x,y,s)=>`<g fill="#fff" opacity=".85"><ellipse cx="${x}" cy="${y}" rx="${30*s}" ry="${11*s}"/><ellipse cx="${x+15*s}" cy="${y-8*s}" rx="${17*s}" ry="${11*s}"/><ellipse cx="${x-15*s}" cy="${y-5*s}" rx="${14*s}" ry="${9*s}"/></g>`;
  const hills=(col,y,amp,op=1)=>`<path d="M0,${y} Q${W*.25},${y-amp} ${W*.5},${y} T${W},${y} L${W},${H} L0,${H}Z" fill="${col}" opacity="${op}"/>`;
  const city=(col,base,hMin,hMax,op)=>{let o='',x=-5,i=0;while(x<W){const w=22+((i*29)%24),h=hMin+((i*53)%(hMax-hMin));o+=`<rect x="${x}" y="${base-h}" width="${w}" height="${h}" fill="${col}" opacity="${op}"/>`;
    for(let k=0;k<h/14;k++)if((i+k)%2)o+=`<rect x="${x+4}" y="${base-h+6+k*14}" width="${w-8}" height="3" fill="#fff" opacity=".35"/>`;x+=w+2;i++}return o};
  const tree=(x,b,s,c='#5aa469')=>`<rect x="${x-2*s}" y="${b-12*s}" width="${4*s}" height="${12*s}" fill="#8a6a4a"/><polygon points="${x},${b-44*s} ${x-14*s},${b-10*s} ${x+14*s},${b-10*s}" fill="${c}"/><polygon points="${x},${b-56*s} ${x-11*s},${b-28*s} ${x+11*s},${b-28*s}" fill="${c}"/>`;
  const sun=(x,y,r,c='#ffd27a')=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}" opacity=".85"/>`;
  const plane=(x,y,s)=>`<g transform="translate(${x},${y}) scale(${s})"><ellipse cx="0" cy="0" rx="34" ry="7" fill="#fff"/><polygon points="-6,0 14,-26 22,-26 8,0" fill="#e9eef5"/><polygon points="-6,0 14,26 22,26 8,0" fill="#e9eef5"/><polygon points="-30,-2 -40,-16 -33,-16 -22,-2" fill="#e9eef5"/><rect x="-24" y="-3" width="40" height="2.5" fill="#d9534f"/></g>`;
  const fuji=(cx,b,w,h)=>`<polygon points="${cx-w/2},${b} ${cx},${b-h} ${cx+w/2},${b}" fill="#7f93bd"/><polygon points="${cx},${b-h} ${cx+w*.15},${b-h*.7} ${cx+w*.07},${b-h*.74} ${cx},${b-h*.66} ${cx-w*.07},${b-h*.74} ${cx-w*.15},${b-h*.7}" fill="#fff"/>`;
  const torii=(x,b,s)=>`<g fill="#d9534f"><rect x="${x-26*s}" y="${b-64*s}" width="${7*s}" height="${64*s}"/><rect x="${x+19*s}" y="${b-64*s}" width="${7*s}" height="${64*s}"/><rect x="${x-36*s}" y="${b-70*s}" width="${72*s}" height="${8*s}" rx="${3*s}"/><rect x="${x-28*s}" y="${b-52*s}" width="${56*s}" height="${5*s}"/></g>`;
  const castle=(x,b,s)=>`<g transform="translate(${x},${b}) scale(${s})"><rect x="-40" y="-34" width="80" height="34" fill="#f5efe4"/><polygon points="-52,-34 52,-34 36,-52 -36,-52" fill="#4c8a72"/><rect x="-28" y="-72" width="56" height="20" fill="#f5efe4"/><polygon points="-40,-72 40,-72 26,-88 -26,-88" fill="#4c8a72"/><rect x="-16" y="-104" width="32" height="16" fill="#f5efe4"/><polygon points="-26,-104 26,-104 14,-120 -14,-120" fill="#4c8a72"/><circle cx="-14" cy="-122" r="3" fill="#e8b92f"/><circle cx="14" cy="-122" r="3" fill="#e8b92f"/><rect x="-62" y="-14" width="124" height="14" fill="#9aa5a0" opacity=".7"/></g>`;
  const tower=(x,b,h)=>`<polygon points="${x},${b-h} ${x-22},${b} ${x+22},${b}" fill="#e0533d"/><polygon points="${x},${b-h*.7} ${x-12},${b-h*.3} ${x+12},${b-h*.3}" fill="#fff" opacity=".6"/><rect x="${x-14}" y="${b-h*.55}" width="28" height="6" fill="#fff"/>`;
  const sky=(x,b,h)=>`<polygon points="${x-6},${b} ${x-2},${b-h} ${x+2},${b-h} ${x+6},${b}" fill="#7d8fb5"/><ellipse cx="${x}" cy="${b-h*.72}" rx="12" ry="5" fill="#9fb0d0"/><ellipse cx="${x}" cy="${b-h*.82}" rx="9" ry="4" fill="#9fb0d0"/>`;
  const house=(x,b,s)=>`<g transform="translate(${x},${b}) scale(${s})"><rect x="-22" y="-20" width="44" height="20" fill="#8a6a4a"/><polygon points="-30,-18 30,-18 0,-62" fill="#c9a46a"/><rect x="-6" y="-12" width="12" height="12" fill="#f5e3b8"/></g>`;
  const train=(x,y,s)=>`<g transform="translate(${x},${y}) scale(${s})"><rect x="-70" y="-14" width="120" height="26" rx="10" fill="#fff"/><path d="M50,-14 Q74,-8 80,12 L50,12Z" fill="#fff"/><rect x="-70" y="-2" width="144" height="4" fill="#2f7d8c"/>${[-56,-36,-16,4,24].map(a=>`<rect x="${a}" y="-9" width="10" height="6" fill="#9ec8e8"/>`).join('')}</g>`;
  const totoro=(x,b,s)=>`<g transform="translate(${x},${b}) scale(${s})" fill="#8b97a3"><ellipse cx="0" cy="-26" rx="26" ry="30"/><polygon points="-16,-52 -12,-72 -6,-54"/><polygon points="16,-52 12,-72 6,-54"/><ellipse cx="0" cy="-18" rx="16" ry="18" fill="#e9eef2"/><circle cx="-9" cy="-42" r="5" fill="#fff"/><circle cx="9" cy="-42" r="5" fill="#fff"/><circle cx="-9" cy="-42" r="2" fill="#333"/><circle cx="9" cy="-42" r="2" fill="#333"/></g>`;
  const mount=(col,b,pk)=>`<polygon points="0,${b} ${pk.map(([x,h])=>`${W*x},${b-h}`).join(' ')} ${W},${b}" fill="${col}"/>`;
  let o=`<defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1">${SK.map((c,i)=>`<stop offset="${i/(SK.length-1)}" stop-color="${c}"/>`).join('')}</linearGradient><clipPath id="mc"><rect width="${W}" height="${H}" rx="18"/></clipPath></defs><g clip-path="url(#mc)"><rect width="${W}" height="${H}" fill="url(#sk)"/>`;
  const B=H;
  if(d===1)o+=sun(W*.82,H*.16,26)+cloud(W*.2,H*.14,1)+cloud(W*.55,H*.25,.8)+plane(W*.68,H*.12,.8)+city('#9fb4cc',B,50,110,.55)+city('#7f97b3',B,30,70,.6);
  if(d===2)o+=cloud(W*.2,H*.13,1)+cloud(W*.72,H*.2,.8)+fuji(W*.62,B-40,W*.8,H*.62)+hills('#79b787',B-34,18,.9)+`<path d="M0,${B-26} Q${W*.3},${B-40} ${W*.6},${B-26} T${W},${B-26} L${W},${B} L0,${B}Z" fill="#8ec5e8" opacity=".85"/>`+tree(W*.1,B-30,1)+tree(W*.2,B-28,.8)+tree(W*.9,B-30,.9);
  if(d===3)o+=sun(W*.5,H*.62,38,'#ffe9b0')+city('#5b5089',B,50,100,.7)+tower(W*.18,B,H*.62)+sky(W*.84,B,H*.78)+city('#463d77',B,20,50,.8);
  if(d===4)o+=cloud(W*.25,H*.15,1)+cloud(W*.78,H*.22,.8)+city('#c9b8d8',B,50,120,.5)+hills('#8fc79a',B-24,12,.9)+torii(W*.16,B-12,1.1)+tree(W*.88,B-14,1)+tree(W*.78,B-12,.8);
  if(d===5)o+=cloud(W*.2,H*.14,1)+cloud(W*.6,H*.1,.7)+castle(W*.78,B-24,1)+hills('#7fbf8e',B-22,14,.9)+train(W*.28,B-46,.8)+`<rect x="0" y="${B-26}" width="${W}" height="3" fill="#8a8f98" opacity=".6"/>`+tree(W*.5,B-24,.8);
  if(d===6)o+=cloud(W*.3,H*.12,.9)+mount('#a9bfd8',B-30,[[.15,H*.5],[.3,H*.3],[.5,H*.62],[.7,H*.34],[.88,H*.52]])+mount('#d7e4f1',B-30,[[.25,H*.2],[.5,H*.3],[.8,H*.22]])+hills('#8abf7a',B-20,14,.95)+house(W*.2,B-18,1.1)+house(W*.42,B-14,.9)+house(W*.7,B-18,1.15)+tree(W*.58,B-16,.8,'#e08a3a')+tree(W*.9,B-16,.9,'#d9622c');
  if(d===7)o+=sun(W*.84,H*.14,24)+cloud(W*.25,H*.14,1)+cloud(W*.6,H*.22,.7)+hills('#9bd18a',B-60,26,.9)+hills('#79bd6a',B-30,22,1)+totoro(W*.2,B-24,1.1)+tree(W*.62,B-26,1.2,'#4c9a5a')+tree(W*.8,B-24,1,'#5aa469');
  if(d===8)o+=sun(W*.2,H*.78,32,'#ffd27a')+cloud(W*.3,H*.2,1.1)+cloud(W*.78,H*.34,.9)+plane(W*.62,H*.16,1)+hills('#cfd8e3',B-20,10,.8)+`<rect x="0" y="${B-16}" width="${W}" height="16" fill="#9aa3ae" opacity=".7"/>`+Array.from({length:Math.floor(W/50)},(_,i)=>`<rect x="${i*50+10}" y="${B-9}" width="26" height="3" fill="#fff" opacity=".8"/>`).join('');
  return o+'</g>';
}

/* ---------- 可愛版示意地圖（只看相對位置）---------- */
function cuteMap(el,d){
  const sp=spotsOf(d),W=Math.max(300,el.clientWidth||340);
  const cols=Math.max(2,Math.min(5,Math.floor(W/118))),padX=46,padT=40,rowH=122;
  const n=sp.length,rows=Math.ceil(n/cols),H=padT+rows*rowH+14;
  const cw=(W-2*padX)/(cols-1);
  const pts=sp.map((s,i)=>{const r=Math.floor(i/cols),c=i%cols;return {s,i,x:padX+(r%2?cols-1-c:c)*cw,y:padT+r*rowH+22}});
  const col=COLORS[d-1];
  const wrap=s=>{
    let t=s.replace(/（[^）]*）|\([^)]*\)/g,'').replace(/\s*→\s*/g,'→').trim();
    const L=9,lines=[];
    if(/\s/.test(t)){
      let cur='';
      t.split(/\s+/).forEach(w=>{
        while(w.length>L){ if(cur){lines.push(cur);cur=''} lines.push(w.slice(0,L));w=w.slice(L) }
        if((cur+' '+w).trim().length<=L)cur=(cur+' '+w).trim();else{ if(cur)lines.push(cur);cur=w }
      });
      if(cur)lines.push(cur);
    }else{
      for(let i=0;i<t.length;i+=L-1)lines.push(t.slice(i,i+L-1));
    }
    if(lines.length>2){lines.length=2;lines[1]=lines[1].slice(0,L-1)+'…'}
    return lines;
  };
  let segs='',arrows='',nodes='';
  for(let i=1;i<pts.length;i++){
    const p=pts[i-1],q=pts[i];
    segs+=`<line x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}" stroke="${col}" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="2 8" opacity=".85"/>`;
    const ang=Math.atan2(q.y-p.y,q.x-p.x)*180/Math.PI,ax=p.x+(q.x-p.x)*.74,ay=p.y+(q.y-p.y)*.74;
    arrows+=`<polygon points="-6,-5 7,0 -6,5" fill="${col}" transform="translate(${ax},${ay}) rotate(${ang})"/>`;
    const em=((q.s.move||'').match(/^[^\s]+/)||[''])[0];
    if(em){const mx=(p.x+q.x)/2,my=(p.y+q.y)/2;
      arrows+=`<g transform="translate(${mx},${my})"><circle r="12" fill="#fff" stroke="${col}" stroke-width="1.5"/><text y="5" text-anchor="middle" font-size="13">${em}</text></g>`}
  }
  pts.forEach(p=>{
    const lines=wrap(p.s.name);
    nodes+=`<g class="pin" data-sid="${p.s.id}" transform="translate(${p.x},${p.y})" style="cursor:pointer">
      <circle r="23" fill="#fff" stroke="${col}" stroke-width="3.5"/>
      <text y="7" text-anchor="middle" font-size="21">${iconOf(p.s.name)}</text>
      <circle cx="18" cy="-18" r="9.5" fill="${col}" stroke="#fff" stroke-width="1.5"/>
      <text x="18" y="-14.2" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">${p.i+1}</text>
      ${lines.map((t,k)=>`<text y="${42+k*14}" text-anchor="middle" font-size="11.5" class="nodelabel">${esc(t)}</text>`).join('')}
      <title>${esc(p.s.name)}｜${p.s.time}</title>
    </g>`;
  });
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="當日行程流程圖">${scene(d,W,H)}${segs}${arrows}${nodes}</g></svg>`;
  $$('.pin',el).forEach(g=>g.onclick=()=>{const t=document.getElementById(g.dataset.sid);t&&t.scrollIntoView({behavior:'smooth'})});
}

/* ---------- 首頁 ---------- */
function renderHome(){
  $('#nHome').classList.add('on');
  const total=T.days.reduce((a,d)=>a+d.spots.length,0);
  const photos=T.days.reduce((a,d)=>a+d.spots.reduce((b,s)=>b+s.items.length,0),0);
  const all=window.EXPENSES||[];
  $('#app').innerHTML=`
  <div class="stats">
    <div class="stat"><b>8</b><span>天</span></div>
    <div class="stat"><b>${total}</b><span>個景點／停留點</span></div>
    <div class="stat"><b>${photos}</b><span>張精選照片</span></div>
    <div class="stat only-exp"><b>${nt(sumTWD(all))}</b><span>總花費（日圓以 ${RATE} 換算）</span></div>
  </div>
  <div class="flow">
    <div class="fnode">🇹🇼 台北</div><span class="farr">✈️</span>
    <div class="fnode">🗼 東京<small>Day 1–4</small></div><span class="farr">🚄</span>
    <div class="fnode">🏯 名古屋<small>Day 5–8</small></div><span class="farr">✈️</span>
    <div class="fnode">🏠 回家</div>
  </div>
  <div class="stepper">${T.days.map(d=>`<a class="step" href="#/day/${d.day}" style="--c:${COLORS[d.day-1]}">
    <i>${d.day}</i><b>${d.date.split(' ')[0]}</b><span>${esc(titleOf('d'+d.day,d.title))}</span></a>`).join('')}</div>
  <div class="dgrid">${T.days.map(d=>{
    const c=coverItem(d.day);
    return `<a class="dcard" href="#/day/${d.day}">${c?`<img loading="lazy" src="${srcThumb(c)}">`:''}<button class="btn only-edit cbtn" data-cover="${d.day}">🖼 換封面</button><div><b style="color:${COLORS[d.day-1]}">Day ${d.day} · ${d.date}</b>${esc(titleOf('d'+d.day,d.title))}<br><small>${d.spots.length} 個停留點</small><span class="dx">${nt(sumTWD(dayExp(d.day)))}</span></div></a>`}).join('')}</div>`;
  $$('[data-cover]').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();pickCover(+b.dataset.cover)});
}
function pickCover(d){
  const ph=spotsOf(d).flatMap(plain);const cur=coverItem(d);
  $('#cpg').innerHTML=ph.map(p=>`<img src="${srcThumb(p)}" data-p="${p.id}" class="${cur&&p.id===cur.id?'sel':''}">`).join('');
  $('#cp').style.display='flex';$('#cpt').textContent=`Day ${d} 封面：點選一張照片`;
  $('#cpg').onclick=e=>{const p=e.target.dataset.p;if(!p)return;T.covers=T.covers||{};T.covers[d]=p;$('#cp').style.display='none';renderHome()};
  $('#cpx').onclick=()=>$('#cp').style.display='none';
}

/* ---------- 每日頁 ---------- */
function navHTML(d){
  const prev=d>1?`<a class="nbtn" href="#/day/${d-1}"><small>前一天</small>‹ ${shortDate(d-1)}</a>`:'<span></span>';
  const next=d<8?`<a class="nbtn r" href="#/day/${d+1}"><small>下一天</small>${shortDate(d+1)} ›</a>`:'<span></span>';
  return `<div class="daynav">${prev}<a class="nbtn home" href="#/">🏠<small>行程總覽</small></a>${next}</div>`;
}
function itemHTML(s,it,j,key='items'){
  const edit=document.body.classList.contains('edit');
  const img=it.locked?`<img class="pp" data-id="${it.id}" hidden>`:`<img loading="lazy" data-full="${srcFull(it)}" src="${srcThumb(it)}">`;
  const ctl=edit?`<div class="pctl"><button data-act="up" data-key="${key}" data-s="${s.id}" data-i="${j}">◀</button><button data-act="down" data-key="${key}" data-s="${s.id}" data-i="${j}">▶</button><button data-act="lock" data-key="${key}" data-s="${s.id}" data-i="${j}" title="${it.locked?'解除鎖定':'鎖定為主角照片'}">${it.locked?'🔒':'🔓'}</button><button data-act="del" data-key="${key}" data-s="${s.id}" data-i="${j}">🗑</button></div>`:'';
  return `<div class="ph${it.locked?' lk':''}"${it.locked?' hidden':''}>${img}${ctl}</div>`;
}
function bookHTML(d,k){
  const t=titleOf('i'+d+k,((window.DAYINFO||{})[d]||{})[k]||'');
  const edit=document.body.classList.contains('edit');
  if(!t&&!edit)return '';
  return `<div class="bookend ${k==='o'?'out':'back'}"><div class="bk${edit?' editable':''}"${edit?' contenteditable="true"':''} data-title="i${d}${k}">${esc(t)}</div></div>`;
}
function moveHTML(s,first){
  const edit=document.body.classList.contains('edit');
  const via=s.via||[];
  if(!s.move&&!edit&&!via.length)return '';
  const pill=(s.move||edit)?`<div class="move${edit?' editable':''}"${edit?' contenteditable="true"':''} data-move="${s.id}" data-ph="${first?'出發方式':'從上一站怎麼過來'}，例如：🚶 步行 5 分">${esc(s.move||'')}</div>`:'';
  return `<div class="mvrow${first?' first':''}">${pill}${via.length?`<div class="mvphotos">${via.map((it,j)=>itemHTML(s,it,j,'via')).join('')}</div>`:''}</div>`;
}
function spotHTML(d,s,i){
  const edit=document.body.classList.contains('edit');
  const exps=s.exp.map(x=>EX[x]);
  return `<section class="spot" id="${s.id}">
    <div class="t">${s.time}</div>
    <h3><span class="num" style="background:${COLORS[d-1]}">${i+1}</span><span class="sname${edit?' editable':''}"${edit?' contenteditable="true"':''} data-name="${s.id}">${esc(s.name)}</span>${s.items.some(x=>x.locked)?` <button class="lkicon" title="這裡有主角照片，點一下輸入密碼查看">🔒<small> 主角照片</small></button>`:''}</h3>
    ${edit?`<textarea class="memo" data-id="${s.id}" placeholder="寫下這個地方的回憶…">${esc(s.memo)}</textarea>`:`<div class="memo ${s.memo?'':'empty'}">${s.memo?esc(s.memo):'（還沒有備註）'}</div>`}
    ${(s.items.length||edit)?`<div class="grid" data-sid="${s.id}">${s.items.map((it,j)=>itemHTML(s,it,j)).join('')}</div>`:''}
    ${edit?`<div class="addrow"><label class="btn">＋ 新增照片<input type="file" accept="image/*" multiple hidden class="addph" data-s="${s.id}"></label>
      <label class="sw"><input type="checkbox" class="newlock"><i></i>新增為主角照片（鎖定）</label></div>`:''}
    ${exps.length?`<div class="exp">${exps.map(e=>`<details class="xi"><summary><span class="xl"><b>${esc(e.place||e.name||e.shop||e.sub)}</b>${e.sum?`<br><small>${esc(e.sum)}</small>`:''}<br><small class="xc">${esc(e.cat)}・${esc(e.sub)} · ${e.time}</small></span><span class="xr">${money(e)}</span></summary><div class="xd">${detailHTML(e)}</div></details>`).join('')}<div class="sum"><span>小計（台幣）</span><span>${nt(sumTWD(exps))}</span></div></div>`:''}
  </section>`;
}
let curDay=0;
function renderDay(d,keepScroll){
  curDay=d;const y=window.scrollY;
  $('#nHome').classList.remove('on');
  const D=T.days[d-1],sp=D.spots;
  $('#app').innerHTML=`${navHTML(d)}
  <h2 class="dt" style="color:${COLORS[d-1]}">Day ${d} · ${D.date}</h2>
  <div class="sub" data-title="d${d}">${esc(titleOf('d'+d,D.title))}</div>
  <div class="stats"><div class="stat only-exp"><b>${nt(sumTWD(dayExp(d)))}</b><span>本日花費（台幣）</span></div></div>
  <div id="dmap" class="cmap"></div>
  <div id="spots">${bookHTML(d,'o')}${sp.map((s,i)=>moveHTML(s,i===0)+spotHTML(d,s,i)).join('')}${bookHTML(d,'b')}</div>
  ${navHTML(d)}`;
  cuteMap($('#dmap'),d);
  $$('textarea.memo').forEach(t=>t.oninput=()=>{sp.find(x=>x.id===t.dataset.id).memo=t.value});
  applyPeople();
  if(keepScroll)window.scrollTo(0,y);
}
document.addEventListener('click',e=>{
  if(e.target.closest('.lkicon')){const t=$('#tPp');t.checked=!t.checked;t.dispatchEvent(new Event('change'))}
});
document.addEventListener('click',async e=>{
  const g=e.target.closest('.grid,.mvphotos');
  const btn=e.target.closest('[data-act]');
  if(btn){
    e.preventDefault();
    const s=spotsOf(curDay).find(x=>x.id===btn.dataset.s),i=+btn.dataset.i,a=btn.dataset.act,key=btn.dataset.key||'items';
    if(a==='up')moveItem(s,i,-1,key);else if(a==='down')moveItem(s,i,1,key);
    else if(a==='del'){if(!confirm('刪除這張照片？（按儲存後才會真的從網站移除）'))return;removeItem(s,i,key)}
    else if(a==='lock'){btn.disabled=true;try{await toggleLock(s,i,key)}catch(err){alert('切換失敗：'+err.message);return}}
    renderDay(curDay,true);return;
  }
  if(g&&g.closest('#spots')){
    const im=e.target.closest('img');if(!im)return;
    const imgs=$$('.ph',g).filter(x=>!x.hidden).map(x=>$('img',x));
    openLB(imgs.map(x=>x.dataset.full||x.src),imgs.indexOf(im));
  }
});
document.addEventListener('input',e=>{
  const n=e.target.closest('[data-name]'),m=e.target.closest('[data-move]');
  if(!n&&!m)return;
  const s=spotsOf(curDay).find(x=>x.id===(n||m).dataset[n?'name':'move']);if(!s)return;
  if(n)s.name=n.textContent;else s.move=m.textContent;
});
document.addEventListener('change',async e=>{
  const inp=e.target.closest('input.addph');if(!inp)return;
  const s=spotsOf(curDay).find(x=>x.id===inp.dataset.s);
  const lock=$('.newlock',inp.closest('.addrow')).checked;
  document.body.style.cursor='wait';
  try{await addPhotos(s,[...inp.files],lock)}catch(err){alert('新增失敗：'+err.message)}
  document.body.style.cursor='';
  renderDay(curDay,true);
});

function route(){
  const m=location.hash.match(/#\/day\/(\d)/);
  m?renderDay(+m[1]):renderHome();
  applyTitles();updateSide();window.scrollTo(0,0);
}
bindExpToggle();bindPeopleToggle();bindLB();
bindEdit(()=>{const m=location.hash.match(/#\/day\/(\d)/);m?renderDay(+m[1],true):renderHome();applyTitles()});
loadNotes().then(()=>{initSide();route()});
window.addEventListener('ratechange',()=>{const m=location.hash.match(/#\/day\/(\d)/);m?renderDay(+m[1],true):renderHome();applyTitles();updateSide()});
window.addEventListener('hashchange',route);
</script>
</body>
</html>
